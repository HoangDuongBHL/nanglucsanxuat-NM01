<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Năng lực sản xuất - Nhà máy bia Đông Mai</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#17202e;--mut:#6a768a;--line:#e6eaf1;--acc:#1f6feb;--edit:#fff3cf;--editb:#f0b429;--fbg:#e6f0fb;--ftx:#1d4b86;--ok:#12805c;--okbg:#e3f6ef;--bad:#d1432f;--badbg:#fdeae6;--inbg:#fff;--sh:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.05);--calc:#f6f7fa;--hbg:#1f3a5f;--hbg2:#2c4d7a;--hfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e131a;--card:#171e28;--ink:#e8edf5;--mut:#92a0b5;--line:#263040;--acc:#5b9bff;--edit:#4a3d12;--editb:#d4a017;--fbg:#1d2d44;--ftx:#a9cbff;--ok:#4cc38a;--okbg:#14352a;--bad:#ef7b6e;--badbg:#3a1f1b;--inbg:#1f2733;--sh:none;--calc:#1b2533;--hbg:#27436b;--hbg2:#325587;--hfg:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
h1{font-size:16px;font-weight:700;margin:0;white-space:pre-line;line-height:1.25;letter-spacing:.01em}
h1::before{content:"";display:inline-block;width:5px;height:18px;background:var(--acc);border-radius:3px;margin-right:9px;vertical-align:-3px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
button{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
.hint{color:var(--mut);font-size:12.5px}
.cnt{font-size:12.5px;color:var(--mut);padding:3px 10px;background:var(--fbg);border-radius:20px}
.help{max-width:1240px;margin:0 auto;padding:0 20px 9px;color:var(--mut);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.leg{display:flex;gap:6px}
.leg span{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 6px;border-radius:20px;font-size:12px;border:1px solid var(--line);background:var(--card)}
.leg span::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c);border:1px solid var(--cb,var(--line))}
main{max-width:1240px;margin:0 auto;padding:18px 20px 70px}
.sum{margin-bottom:8px}
.sum h2{margin:0 0 12px;font-size:15px;font-weight:700}
.yc{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.yr{background:var(--card);border-radius:14px;box-shadow:var(--sh);border:1px solid var(--line);padding:14px 16px}
.yh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.yh b{font-size:17px}
.big{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.big small{font-size:12px;font-weight:500;color:var(--mut);margin-left:4px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.na{background:var(--fbg);color:var(--mut)}
.pl{color:var(--mut);font-size:12.5px;margin:8px 0 6px}
.mr{margin-top:9px}
.mr .l{display:flex;justify-content:space-between;font-size:12.5px}
.mr .l span:first-child{color:var(--mut)}
.mr.min .l span:last-child{color:var(--bad);font-weight:700}
.tr{position:relative;height:7px;border-radius:5px;background:var(--fbg);margin-top:4px}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--acc);opacity:.85}
.mr.min .tr i{background:var(--bad);opacity:1}
.tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
h3{margin:30px 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
h4{margin:20px 0 8px;font-size:13.5px;font-weight:600;color:var(--mut)}
.tw{background:var(--card);border-radius:14px;box-shadow:var(--sh);border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
td:nth-child(2){min-width:230px}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
tbody tr:last-child td{border-bottom:0}
th{background:var(--hbg);font-size:12.5px;font-weight:600;color:var(--hfg);white-space:pre-line;border-bottom:0}
td.stt{width:44px;color:var(--mut);text-align:center;font-size:12.5px}
td.unit{width:96px;color:var(--mut);font-size:12.5px}
td.val{width:160px}
td.note{color:var(--mut);font-size:12.5px;min-width:200px}
tr.sub td{background:var(--hbg2);font-weight:700;text-align:right;color:var(--hfg);padding-top:4px;padding-bottom:6px;border-bottom:0}
input.c{width:100%;text-align:right;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--inbg);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;transition:.12s}
input.c:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
input.c:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
input.c.f{background:var(--fbg);border-color:transparent;color:var(--ftx);font-weight:500;cursor:default;pointer-events:none;user-select:none}
input.c.f.dep{font-weight:700;color:var(--ftx);box-shadow:inset 3px 0 0 var(--acc)}
input.c.f.neck{background:var(--badbg);color:var(--bad);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--bad)}
input.c.chg{background:var(--edit);border-color:var(--editb);font-weight:600}
.ex{display:inline-flex;align-items:center;gap:6px;margin:2px 0}
.ex input{width:130px}
.ex i{font-style:normal;color:var(--mut);font-size:11.5px}
.nt{outline:none;border-radius:6px;padding:2px 6px;margin:1px -6px;min-height:1.4em;white-space:pre-wrap;transition:.12s}
.nt:hover{background:var(--calc)}
.nt:focus{background:var(--inbg);box-shadow:0 0 0 2px var(--acc)}
.nt.chg{background:var(--edit);color:var(--ink)}
.nt:empty::before{content:'+ ghi chú';opacity:.4}
@media(max-width:700px){
header{position:static}
.hin{padding:10px 14px 4px}
.help{padding:0 14px 10px}
.help>span:not(.leg){display:none}
.leg{flex-wrap:wrap}
main{padding:12px 12px 60px}
.bar{margin-left:0;width:100%}
.yc{grid-template-columns:1fr}
.big{font-size:22px}
.tw{overflow:visible;background:transparent;border:0;box-shadow:none;border-radius:0}
table,tbody{display:block;min-width:0;width:100%}
thead{display:none}
tr.sub{display:none}
tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px;box-shadow:var(--sh)}
td,td:nth-child(2){display:block;border:0;padding:0;min-width:0}
td.stt{display:none}
td:nth-child(2){grid-column:1/-1;font-weight:600;font-size:14px;line-height:1.35}
td:nth-child(2)[data-stt]:not([data-stt=""])::before{content:attr(data-stt) ". ";color:var(--mut);font-weight:500}
td.unit{grid-column:1/-1;margin-top:-5px;font-size:12px}
td.val{width:auto}
td.val:empty{display:none}
td.val::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--mut);margin-bottom:2px;min-height:0}
td.val[data-label=""]::before{display:none}
td.note{grid-column:1/-1;min-width:0}
td.note:has(.nt:empty:only-child){display:none}
input.c{padding:9px 10px;font-size:16px}
.ex{display:flex;margin-top:4px}.ex input{width:100%}
h3{margin-top:22px}
}

@media print{header{position:static}button{display:none}}
</style>
</head>

 </div>
</header>
<main>
